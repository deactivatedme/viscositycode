[package]
name = "viscosity-live-re"
# helperVersion reported by the hello handshake. Bump on any behavior change so
# stale staged binaries are detectable (see .agents/docs/versioning.md).
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "ViscosityCode live reversing MCP server (drives LLDB through lldb-dap)"

[lib]
name = "viscosity_live_re"
path = "src/lib.rs"

[[bin]]
name = "viscosity-live-re"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# DAP readMemory returns base64; same version the MCP relay already ships.
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
